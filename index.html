<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07110f"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><title>Mizan — Personal Formation System</title><style>
:root{--bg:#07110f;--bg2:#0b1815;--card:#10221f;--card2:#142a26;--line:#29463f;--text:#f4f0e4;--muted:#8ea69f;--gold:#d9ae58;--gold2:#f1d58f;--teal:#55b09a;--blue:#79add7;--copper:#d49a69;--violet:#aa97d1;--rose:#d98989;--serif:Georgia,serif;--sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--r:22px}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans)}body{display:flex;justify-content:center}button,input,textarea{font:inherit}button{cursor:pointer}#app{width:100%;max-width:540px;min-height:100vh;background:radial-gradient(650px 360px at 70% -5%,#19342d 0%,transparent 62%),linear-gradient(#0b1815,#07110f 70%);position:relative}.wrap{padding:0 18px 112px}.top{position:sticky;top:0;z-index:20;padding:17px 0 13px;background:linear-gradient(#0b1815 76%,transparent);backdrop-filter:blur(12px)}.topline{display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold)}.greet{font:24px var(--serif);margin-top:4px}.date{font-size:11px;color:var(--muted);margin-top:3px}.menu{width:39px;height:39px;border:1px solid var(--line);background:#10221f;color:var(--text);border-radius:50%}.view{animation:in .38s cubic-bezier(.2,.9,.25,1)}@keyframes in{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:none}}@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.035)}100%{transform:scale(1)}}.card{background:linear-gradient(145deg,#142a26,#0f211e);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 18px 45px #0005}.hero{padding:22px;margin:5px 0 13px;overflow:hidden;position:relative}.hero:after{content:"";position:absolute;width:260px;height:260px;right:-110px;top:-120px;background:radial-gradient(circle,#d9ae581a,transparent 68%)}.chip{display:inline-flex;padding:7px 10px;border-radius:99px;background:#d9ae5812;border:1px solid #d9ae5838;color:var(--gold2);font-size:9px;letter-spacing:1.1px;text-transform:uppercase}.hero h1{font:32px/1.08 var(--serif);margin:10px 0}.hero p{color:var(--muted);font-size:13px;line-height:1.65;max-width:440px}.section{display:flex;justify-content:space-between;align-items:end;margin:22px 2px 10px}.section h2{font:19px var(--serif);margin:0}.section small{font-size:10px;color:var(--muted)}.scale{padding:15px;margin-bottom:13px}.scalehead{display:flex;justify-content:space-between;font:16px var(--serif);padding:0 6px}.score{font:12px var(--sans);color:var(--gold)}svg{display:block}.beam{transform-origin:220px 70px;transition:transform .9s cubic-bezier(.2,1.2,.2,1)}.scale-note{text-align:center;font:15px var(--serif);margin-top:-2px}.scale-note b{color:var(--gold)}.scale-sub{text-align:center;color:var(--muted);font-size:10px;margin-top:5px}.reminder{padding:18px;margin-bottom:14px;position:relative;overflow:hidden}.reminder .label{font-size:9px;text-transform:uppercase;letter-spacing:1.3px;color:var(--gold)}.reminder .quote{font:17px/1.55 var(--serif);margin:9px 0}.reminder .src{font-size:10px;color:var(--muted)}.pillars{display:grid;gap:10px}.pillar{padding:15px;border-left:3px solid var(--c)}.phead{display:flex;align-items:center;gap:11px}.picon{width:38px;height:38px;border-radius:13px;background:color-mix(in srgb,var(--c) 14%,transparent);display:grid;place-items:center;font-size:18px}.pname{font:17px var(--serif)}.psub{font-size:10px;color:var(--muted)}.pcount{margin-left:auto;font-size:10px;color:var(--muted)}.task{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid #29463f99;margin-top:11px}.check{width:23px;height:23px;border:1.5px solid #3b5b53;border-radius:8px;flex:none;display:grid;place-items:center}.task.on .check{background:var(--gold);border-color:var(--gold);color:#1f1708;animation:pop .3s}.task.on .check:after{content:'✓';font-weight:800}.tasktext{font-size:13px}.taskwhy{font-size:10px;color:var(--muted);margin-top:2px}.task.on .tasktext{color:#728b84;text-decoration:line-through}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{padding:15px}.metric small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:1px}.metric strong{display:block;font:26px var(--serif);margin-top:4px}.goal{padding:17px;margin-bottom:10px}.goalhead{display:flex;gap:10px}.goalicon{font-size:20px}.goaltitle{font:17px var(--serif)}.goald{font-size:12px;color:var(--muted);line-height:1.55;margin-top:4px}.steps{display:grid;gap:7px;margin-top:13px}.step{padding:10px 11px;border:1px solid var(--line);border-radius:12px;background:#07110f66;color:var(--muted);font-size:10px}.step b{display:block;color:var(--text);font:13px var(--serif);margin-bottom:2px}.step.now{border-color:#d9ae5866;background:#d9ae580b}.bar{height:6px;background:#07110f;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));border-radius:99px;transition:width .7s}.barrow{display:grid;grid-template-columns:90px 1fr 32px;gap:8px;align-items:center;margin:12px 0}.barrow label{font-size:10px}.barrow em{font-style:normal;font-size:10px;color:var(--muted);text-align:right}.field{margin:10px 0}.field label{display:block;color:var(--gold);font-size:9px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}.field textarea{width:100%;min-height:72px;background:#07110f;color:var(--text);border:1px solid var(--line);border-radius:13px;padding:11px;resize:vertical;outline:none}.field textarea:focus{border-color:var(--gold)}.btn{border:0;border-radius:99px;padding:12px 16px;background:var(--gold);color:#211806;font-weight:750}.btn.alt{background:transparent;color:var(--text);border:1px solid var(--line)}.library{padding:17px;margin-bottom:10px}.arabic{direction:rtl;text-align:right;font:23px/1.8 "Times New Roman",serif}.translation{font:14px/1.55 var(--serif);margin-top:7px}.source{font-size:10px;color:var(--muted);margin-top:8px}.source a{color:var(--gold)}.checklist{padding:8px 15px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:540px;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:8px 7px calc(9px + env(safe-area-inset-bottom));background:#07110fee;backdrop-filter:blur(16px);border-top:1px solid var(--line)}.tab{border:0;background:transparent;color:#6f8881;border-radius:14px;padding:7px 2px;font-size:9px;display:grid;place-items:center;gap:3px}.tab .ico{font-size:18px}.tab.active{color:var(--gold);background:#d9ae5810}.drawer{position:fixed;inset:0;background:#0008;z-index:80;opacity:0;pointer-events:none;transition:.25s}.drawer.open{opacity:1;pointer-events:auto}.sheet{position:absolute;bottom:0;left:0;right:0;max-width:540px;margin:auto;background:#10221f;border:1px solid var(--line);border-radius:25px 25px 0 0;padding:18px 18px 28px;transform:translateY(100%);transition:.35s}.drawer.open .sheet{transform:none}.handle{width:42px;height:4px;background:#3a5a52;border-radius:99px;margin:0 auto 18px}.mi{padding:15px 2px;border-bottom:1px solid var(--line);font-size:13px}.toast{position:fixed;bottom:91px;left:50%;transform:translate(-50%,20px);opacity:0;background:var(--gold);color:#201807;padding:10px 15px;border-radius:99px;font-size:11px;font-weight:750;z-index:100;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}.onboard{min-height:100vh;display:grid;place-items:center;padding:25px;text-align:center}.ob{max-width:420px}.mark{width:94px;margin-bottom:16px}.ob h1{font:42px var(--serif);color:var(--gold);margin:0}.ob .ar{direction:rtl;font:20px var(--serif);color:var(--gold2);margin:4px}.ob .big{font:20px/1.5 var(--serif);margin:22px 0}.ob p{font-size:13px;color:var(--muted);line-height:1.6}.ob input{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--text);text-align:center;margin:15px 0 8px}.ob button{width:100%}@media(min-width:700px){body{padding:20px 0}.nav{bottom:20px;border:1px solid var(--line);border-radius:20px;width:520px}.wrap{padding-bottom:130px}}
</style></head><body><div id="app"></div><script>
const K='mizan_complete_v3';let S=JSON.parse(localStorage.getItem(K)||'null')||{onboard:true,name:'',done:{},worship:{},journal:{},weekly:{},xp:0};let view='home';
const P=[['allah','Allah','Taqwa & worship','☪','#d9ae58'],['self','Self','Inner freedom','◉','#79add7'],['body','Body','Physical capability','◇','#55b09a'],['family','Family','Presence & trust','⌂','#d49a69'],['cap','Capability','Work, money & service','✦','#aa97d1']];
const T=[['salah','allah','Protect the five prayers','Allah is the center of the life you are building.'],['quran','allah','Qur’an / Hifz','Build a living relationship with revelation.'],['return','allah','Return quickly after a slip','Formation is return, not perfection.'],['pause','self','Pause before one impulse','Feel it. Notice it. Choose.'],['presence','self','10 minutes without stimulation','Reclaim your attention.'],['move','body','Train / soccer / purposeful movement','Your body is an instrument for living.'],['sleep','body','Protect sleep and nutrition','Capability requires recovery.'],['kids','family','Present time with your children','Be there, not merely nearby.'],['word','family','Keep one promise / responsibility','Become someone who can be trusted.'],['deep','cap','One meaningful deep-work block','Build the capability that creates freedom.'],['learn','cap','Read / learn / build','Become more useful.'],['service','cap','One act of useful service','Capability should flow outward.']];
const R=[['Qur’an','59:18','Let every soul look to what it has sent forward for tomorrow.','allah'],['Hadith','Sahih al-Bukhari 1','Deeds are judged by intentions, and every person will have what they intended.','allah'],['Hadith','Sahih al-Bukhari 6114','The strong person is the one who controls himself when angry.','self'],['Hadith','Sahih Muslim 2664','Seek what benefits you, seek Allah’s help, and do not give up.','self'],['Hadith','Sahih al-Bukhari 6464','The most beloved deed to Allah is the most regular and constant, even if it is little.','allah'],['Hadith','Sahih Muslim 2999','When good reaches the believer he is grateful; when hardship reaches him he is patient — and both are good for him.','self'],['Qur’an','13:11','Allah does not change the condition of a people until they change what is within themselves.','self'],['Hadith','Sahih al-Bukhari 6412','There are two blessings many people fail to appreciate: health and free time.','body'],['Qur’an','51:56','I did not create jinn and humans except to worship Me.','allah'],['Qur’an','94:5–6','Indeed, with hardship comes ease. Indeed, with hardship comes ease.','self']];
const Q=[['51:56','وَمَا خَلَقْتُ ٱلْجِنَّ وَٱلْإِنسَ إِلَّا لِيَعْبُدُونِ','I did not create jinn and humans except to worship Me.'],['59:18','يَـٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱتَّقُوا۟ ٱللَّهَ وَلْتَنظُرْ نَفْسٌۭ مَّا قَدَّمَتْ لِغَدٍۢ','O believers! Be mindful of Allah, and let every soul look to what it has sent forward for tomorrow.'],['13:11','إِنَّ ٱللَّهَ لَا يُغَيِّرُ مَا بِقَوْمٍ حَتَّىٰ يُغَيِّرُوا۟ مَا بِأَنفُسِهِمْ','Allah does not change the condition of a people until they change what is within themselves.'],['94:5–6','فَإِنَّ مَعَ ٱلْعُسْرِ يُسْرًا ۝ إِنَّ مَعَ ٱلْعُسْرِ يُسْرًا','So, surely with hardship comes ease. Surely with hardship comes ease.']];
const H=[['Sahih al-Bukhari 1','Deeds are judged by intentions, and every person will have what they intended.','Intention','https://sunnah.com/bukhari:1'],['Sahih al-Bukhari 6114','The strong person is the one who controls himself when angry.','Self-mastery','https://sunnah.com/bukhari:6114'],['Sahih Muslim 2664','Seek what benefits you, seek Allah’s help, and do not give up.','Agency & reliance','https://sunnah.com/muslim:2664'],['Sahih al-Bukhari 6464','The most beloved deed to Allah is the most regular and constant, even if it is little.','Consistency','https://sunnah.com/bukhari:6464'],['Sahih al-Bukhari 6412','There are two blessings many people fail to appreciate: health and free time.','Time & health','https://sunnah.com/bukhari:6412'],['Sahih Muslim 2999','When good reaches the believer he is grateful; when hardship reaches him he is patient — and both are good for him.','Gratitude & patience','https://sunnah.com/muslim:2999']];
function save(){localStorage.setItem(K,JSON.stringify(S))}function dk(){return new Date().toISOString().slice(0,10)}function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function pct(){let d=S.done[dk()]||{};return Math.round(T.filter(x=>d[x[0]]).length/T.length*100)}function pc(id){let d=S.done[dk()]||{},a=T.filter(x=>x[1]===id);return Math.round(a.filter(x=>d[x[0]]).length/a.length*100)}function wp(id){let total=0,n=0;for(let i=0;i<7;i++){let d=new Date();d.setDate(d.getDate()-i);let k=d.toISOString().slice(0,10);if(S.done[k]){let a=T.filter(x=>x[1]===id);total+=a.filter(x=>S.done[k][x[0]]).length/a.length;n++}}return n?Math.round(total/n*100):0}function lvl(){return {l:Math.floor((S.xp||0)/100)+1,x:(S.xp||0)%100}}function toast(x){let e=document.querySelector('.toast');if(!e)return;e.textContent=x;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1700)}function award(){let b=lvl().l;S.xp=(S.xp||0)+5;let a=lvl().l;if(a>b)toast('Level '+a+' — formation is compounding.');}
function reminder(){let w=[...P].sort((a,b)=>wp(a[0])-wp(b[0]))[0][0],m=R.filter(x=>x[3]===w);return m[(new Date().getDate()+new Date().getMonth())%m.length]||R[0]}
function scale(){let p=pct(),ang=-12+p*.12;return `<div class="scale card"><div class="scalehead"><span>Mīzān · today</span><span class="score">${p}% aligned</span></div><svg viewBox="0 0 440 160" width="100%" height="160"><path d="M220 22v108M190 130h60l-9 18h-42zM176 148h88" stroke="#29463f" stroke-width="4" fill="none" stroke-linecap="round"/><g class="beam" style="transform:rotate(${ang}deg)"><line x1="70" y1="28" x2="370" y2="28" stroke="#d9ae58" stroke-width="5" stroke-linecap="round"/><circle cx="220" cy="28" r="7" fill="#d9ae58"/><line x1="70" y1="28" x2="70" y2="64" stroke="#55b09a" stroke-width="2"/><path d="M42 64Q70 93 98 64" fill="#10221f" stroke="#55b09a"/><line x1="370" y1="28" x2="370" y2="64" stroke="#55b09a" stroke-width="2"/><path d="M342 64Q370 93 398 64" fill="#10221f" stroke="#55b09a"/></g></svg><div class="scale-note">${p===100?'<b>Balanced.</b> You showed up.':p===0?'The scale awaits your first deed.':`<b>${p}%</b> of today’s formation is weighed in.`}</div><div class="scale-sub">It measures actions, not your worth.</div></div>`}
function header(){return `<header class="top"><div class="topline"><div><div class="eyebrow">MĪZĀN · PERSONAL FORMATION</div><div class="greet">As-salāmu ʿalaykum, ${esc(S.name)}</div><div class="date">${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div></div><button class="menu" id="menu">☰</button></div></header>`}
function tab(id,i,n){return `<button class="tab ${view===id?'active':''}" data-v="${id}"><span class="ico">${i}</span>${n}</button>`}
function base(content){return `<div class="wrap">${header()}<main class="view">${content}</main></div><nav class="nav">${tab('home','⌂','Today')}${tab('plan','◎','Plan')}${tab('formation','◈','Formation')}${tab('islam','☪','Islam')}${tab('review','↗','Review')}</nav><div class="drawer" id="drawer"><div class="sheet"><div class="handle"></div><div class="eyebrow">MIZAN</div><div class="mi" data-act="export">⇩ Export data</div><div class="mi" data-act="reset">↺ Reset everything</div><div class="mi">Your data stays in this browser.</div></div></div><div class="toast"></div>`}
function home(){let r=reminder(),d=S.done[dk()]||{};return base(`<div class="hero card"><span class="chip">Today · ${pct()}% alignment</span><h1>Live deliberately.<br>Become who you said you would.</h1><p>Mizan connects your life direction to what you actually do today. The aim is formation, not productivity for its own sake.</p></div>${scale()}<div class="reminder card"><div class="label">${r[0]} · ${r[1]}</div><div class="quote">“${r[2]}”</div><div class="src">Let the reminder become an action.</div></div><div class="section"><h2>Today’s formation</h2><small>${T.filter(x=>d[x[0]]).length}/${T.length} actions</small></div><div class="pillars">${P.map(p=>{let a=T.filter(x=>x[1]===p[0]),done=a.filter(x=>d[x[0]]).length;return `<article class="pillar card" style="--c:${p[4]}"><div class="phead"><div class="picon">${p[3]}</div><div><div class="pname">${p[1]}</div><div class="psub">${p[2]}</div></div><div class="pcount">${done}/${a.length}</div></div>${a.map(t=>`<div class="task ${d[t[0]]?'on':''}" data-task="${t[0]}"><div class="check"></div><div><div class="tasktext">${t[2]}</div><div class="taskwhy">${t[3]}</div></div></div>`).join('')}</article>`}).join('')}</div>`)}
function plan(){let desc={allah:'Become a man whose private and public character reflect his relationship with Allah.',self:'Become internally free: able to feel fear, anger, lust and praise without surrendering decisions to them.',body:'Build a lean, strong, mobile, athletic body that enables soccer, travel, play and long-term health.',family:'Become a father and future spouse who is present, reliable, emotionally available and worthy of respect.',cap:'Become capable enough to solve, build, provide and serve; grow skills, earning power, useful projects and freedom.'};return base(`<div class="hero card"><span class="chip">Direction → action</span><h1>Your life has a direction.</h1><p>Keep the long horizon visible while making today concrete. These are directions, not rigid identities.</p></div><div class="section"><h2>North Star</h2></div><div class="goal card"><div class="goaltitle">Become a man deeply connected to Allah, master of himself, physically capable, present for his family, useful to others, and free enough to live deliberately.</div><div class="goald">Freedom means enough capability that money, body, mind and other people’s approval do not constantly dictate the shape of your life.</div></div><div class="section"><h2>The cascade</h2><small>Why today exists</small></div><div class="card goal"><div class="steps"><div class="step"><b>Life direction</b>Who do I want to become?</div><div class="step"><b>10-year vision</b>Deep taqwa, inner freedom, athletic health, trusted family, financial capability, meaningful service and exploration.</div><div class="step now"><b>2027 · Become a man who can trust himself</b>When I decide something matters, I increasingly do what I said I would do.</div><div class="step"><b>90 days</b>Consistency before intensity. Build systems that survive ordinary days.</div><div class="step"><b>Today</b>Small actions that embody the person above.</div></div></div><div class="section"><h2>Five life goals</h2></div>${P.map(p=>`<article class="goal card"><div class="goalhead"><div class="goalicon">${p[3]}</div><div><div class="goaltitle">${p[1]} · ${p[2]}</div><div class="goald">${desc[p[0]]}</div></div></div><div class="steps"><div class="step"><b>Operating principle</b>${({allah:'Private integrity: Allah’s gaze matters more than people’s gaze.',self:'Freedom means choosing according to principles rather than impulse, circumstance or approval.',body:'My body is an instrument for living, serving and experiencing Allah’s creation.',family:'My children should experience me, not merely my provision.',cap:'Capability is a means of service and freedom, not status for its own sake.'})[p[0]]}</div></div></article>`).join('')}`)}
function formation(){let l=lvl();return base(`<div class="hero card"><span class="chip">Formation</span><h1>Become someone you can trust.</h1><p>Mizan is not trying to manufacture a perfect person. It trains the return: notice the gap, learn, correct, continue.</p></div><div class="grid2"><div class="metric card"><small>Level</small><strong>${l.l}</strong></div><div class="metric card"><small>XP</small><strong>${S.xp||0}</strong></div></div><div class="section"><h2>The man you are forming</h2></div>${[['A man of taqwa','When alone, he behaves as though the most important gaze is upon him.'],['A self-governed man','He can be angry without becoming anger; afraid without becoming fear; tempted without surrender.'],['A capable man','He learns, builds, solves and develops his body so that he can act rather than remain constrained.'],['A present father','His children experience love through time, attention, patience and reliability.'],['A useful man','When he can help, he does not look away — whether the need is technical, practical or ordinary.'],['A grateful man','He learns from the past, plans the future, and still inhabits the present.']].map(x=>`<div class="goal card"><div class="goaltitle">${x[0]}</div><div class="goald">${x[1]}</div></div>`).join('')}<div class="section"><h2>Formation rule</h2></div><div class="goal card"><div class="goald" style="font-size:13px">Do not use Mizan to prove that you are good. Use it to see where your actions and principles disagree — then return.</div></div>`)}
function islam(){let r=reminder(),w=S.worship[dk()]||{};return base(`<div class="hero card"><span class="chip">Islam · source-first</span><h1>Let revelation form the person.</h1><p>Qur’an and authentic Sunnah are not decorative quotes. They should shape intention, action, character, patience, gratitude and return.</p></div><div class="reminder card"><div class="label">${r[0]} · ${r[1]}</div><div class="quote">“${r[2]}”</div><div class="src">Source-first reminder</div></div><div class="section"><h2>Ibadah check-in</h2><small>awareness, not gamification</small></div><div class="checklist card">${['Fajr','Dhuhr','Asr','Maghrib','Isha','Qur’an / Hifz','Dhikr / dua','Sadaqah / useful service'].map(x=>`<div class="task ${w[x]?'on':''}" data-w="${x}"><div class="check"></div><div class="tasktext">${x}</div></div>`).join('')}</div><div class="section"><h2>Qur’an</h2><small>selected for formation</small></div>${Q.map(q=>`<article class="library card"><div class="eyebrow">Qur’an ${q[0]}</div><div class="arabic">${q[1]}</div><div class="translation">${q[2]}</div><div class="source"><a target="_blank" href="https://quran.com/${q[0].split(':')[0]}">Read in context ↗</a></div></article>`).join('')}<div class="section"><h2>Authentic Ahadith</h2><small>Sahih sources</small></div>${H.map(h=>`<article class="library card"><div class="eyebrow">${h[2]}</div><div class="translation">“${h[1]}”</div><div class="source">${h[0]} · <a target="_blank" href="${h[3]}">Source ↗</a></div></article>`).join('')}`)}
function review(){let l=lvl();return base(`<div class="hero card"><span class="chip">Muhasabah</span><h1>Measure the gap. Return.</h1><p>Be honest, not harsh. The purpose of review is correction, not self-condemnation.</p></div><div class="grid2"><div class="metric card"><small>Today</small><strong>${pct()}%</strong></div><div class="metric card"><small>Level</small><strong>${l.l}</strong></div></div><div class="section"><h2>Seven-day alignment</h2></div><div class="card" style="padding:15px">${P.map(p=>`<div class="barrow"><label>${p[1]}</label><div class="bar"><i style="width:${wp(p[0])}%;background:${p[4]}"></i></div><em>${wp(p[0])}%</em></div>`).join('')}</div><div class="section"><h2>Today’s reflection</h2></div><div class="card" style="padding:16px">${field('j1','What pleased Allah today?')}${field('j2','Where did I drift?')}${field('j3','What did I learn?')}${field('j4','What is tomorrow’s one adjustment?')}<button class="btn" id="savej">Save reflection</button></div><div class="section"><h2>Weekly Mizan</h2><small>one correction, not ten</small></div><div class="card" style="padding:16px">${field('w1','What went well?')}${field('w2','Where did I drift?')}${field('w3','Why?')}${field('w4','Where did I act against my principles?')}${field('w5','What is the ONE adjustment for next week?')}<button class="btn alt" id="savew">Save weekly Mizan</button></div>`)}
function field(id,l){let e=S.journal[dk()]||{};let w=S.weekly[dk()]||{};let v=id[0]=='j'?e[id]||'':w[id]||'';return `<div class="field"><label>${l}</label><textarea id="${id}">${esc(v)}</textarea></div>`}
function render(){document.getElementById('app').innerHTML=S.onboard?onboard():({home,plan,formation,islam,review}[view]());bind()}
function onboard(){return `<div class="onboard"><div class="ob"><svg class="mark" viewBox="0 0 100 100" fill="none"><path d="M50 8v44M15 30l35-12 35 12M15 30q0 16 15 16t15-16M55 30q0 16 15 16t15-16" stroke="#d9ae58" stroke-width="2.5" stroke-linecap="round"/><path d="M35 52h30l-5 10H40zM30 62h40v6H30z" fill="#d9ae58"/></svg><div class="eyebrow">MĪZĀN · PERSONAL FORMATION</div><h1>Mizan</h1><div class="ar">ميزان</div><div class="big">“Am I deliberately becoming the person I want to become — or am I just undergoing life?”</div><p>Direction → formation → action → reflection → return.</p><input id="name" placeholder="Your name" maxlength="28"><button class="btn" id="begin" disabled>Begin Mizan</button></div></div>`}
function bind(){document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{view=x.dataset.v;render()});let m=document.getElementById('menu');if(m)m.onclick=()=>document.getElementById('drawer').classList.add('open');let dr=document.getElementById('drawer');if(dr)dr.onclick=e=>{if(e.target===dr)dr.classList.remove('open');if(e.target.dataset.act){if(e.target.dataset.act==='reset'&&confirm('Erase all Mizan data?')){localStorage.removeItem(K);location.reload()}if(e.target.dataset.act==='export'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='mizan-backup.json';a.click()}}};let n=document.getElementById('name');if(n){n.oninput=()=>document.getElementById('begin').disabled=!n.value.trim();document.getElementById('begin').onclick=()=>{S.name=n.value.trim();S.onboard=false;save();render()}}document.querySelectorAll('[data-task]').forEach(e=>e.onclick=()=>{let d=S.done[dk()]||(S.done[dk()]={}),id=e.dataset.task;d[id]=!d[id];if(d[id]){award();toast('Counted. Keep going.')}save();render()});document.querySelectorAll('[data-w]').forEach(e=>e.onclick=()=>{let w=S.worship[dk()]||(S.worship[dk()]={}),id=e.dataset.w;w[id]=!w[id];save();render()});let sj=document.getElementById('savej');if(sj)sj.onclick=()=>{S.journal[dk()]={j1:v('j1'),j2:v('j2'),j3:v('j3'),j4:v('j4')};save();toast('Reflection saved.');render()};let sw=document.getElementById('savew');if(sw)sw.onclick=()=>{S.weekly[dk()]={w1:v('w1'),w2:v('w2'),w3:v('w3'),w4:v('w4'),w5:v('w5')};save();toast('Weekly Mizan saved.')}}function v(id){return document.getElementById(id)?.value.trim()||''}
render();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js').catch(err => console.warn('Mizan service worker:', err));
  });
}
</script></body></html>
